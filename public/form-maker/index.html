<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>山歩会フォームメーカー</title>
  <style>
    :root {
      color-scheme: light;
      --host-bg: #ffffff;
      --host-text: #161616;
    }
    :root[data-theme='g100'] {
      color-scheme: dark;
      --host-bg: #161616;
      --host-text: #f4f4f4;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--host-bg);
      color: var(--host-text);
    }
    body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #form-maker-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: var(--host-bg);
      color-scheme: inherit;
    }
    .fallback {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 3.5rem;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      margin: 0;
      padding: .5rem 1rem max(.5rem, env(safe-area-inset-bottom));
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: var(--host-text);
      background: var(--host-bg);
      border-top: 1px solid color-mix(in srgb, var(--host-text) 20%, transparent);
    }
    .fallback a { color: #0f62fe; }
    .loading-message { margin: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <iframe
    id="form-maker-frame"
    title="山歩会フォームメーカー"
    allow="clipboard-write; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <div class="fallback" id="form-maker-status" role="status" aria-live="polite">
    <p class="loading-message" id="form-maker-message">フォームメーカーを読み込んでいます。</p>
    <a href="https://script.google.com/macros/s/AKfycbw0R5VgBdSLS8aRDJDw7GUIEfHlXRZ6rPrOgjXmO2N7LvhuoGyS_opUCFTCSiUiDZw5/exec" target="_blank" rel="noopener noreferrer">フォームメーカーが開かない場合はこちら</a>
  </div>

  <script type="module">
    import { mergeFormHistories } from './history-utils.js';
    import { isTrustedAppMessage } from './message-origin.js';

    (() => {
      const KEY = 'sanpokai-theme-preference-v1';
      const VALID = new Set(['system', 'light', 'dark']);
      const HISTORY_KEY = 'sanpokai-form-builder-history-v1';
      const HISTORY_CHILD_SOURCE = 'sanpokai-form-history-child';
      const HISTORY_HOST_SOURCE = 'sanpokai-form-history-host';
      const APP_URL = 'https://script.google.com/macros/s/AKfycbw0R5VgBdSLS8aRDJDw7GUIEfHlXRZ6rPrOgjXmO2N7LvhuoGyS_opUCFTCSiUiDZw5/exec';
      const frame = document.getElementById('form-maker-frame');
      const status = document.getElementById('form-maker-status');
      const messageNode = document.getElementById('form-maker-message');
      const meta = document.querySelector('meta[name="theme-color"]');
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const themeChannel = createChannel('theme');
      const historyChannel = createChannel('history');
      let preference = readPreference();
      let historyReady = false;
      const fallbackTimer = window.setTimeout(() => {
        if (historyReady) return;
        messageNode.textContent = '読み込みに時間がかかっています。';
      }, 10000);

      function createChannel(prefix) {
        if (window.crypto?.randomUUID) return window.crypto.randomUUID();
        const random = Math.random().toString(36).slice(2);
        return `${prefix}-${Date.now().toString(36)}-${random}`;
      }

      function readPreference() {
        try {
          const stored = localStorage.getItem(KEY);
          return VALID.has(stored) ? stored : 'system';
        } catch {
          return 'system';
        }
      }

      function readHistory() {
        try {
          const value = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      }

      function saveHistory(history) {
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch {}
        return history;
      }

      function sendHistory(target, history, targetOrigin) {
        target?.postMessage?.({
          source: HISTORY_HOST_SOURCE,
          channel: historyChannel,
          type: 'history-state',
          history,
        }, targetOrigin);
      }

      function resolveTheme(pref) {
        return pref === 'dark' || (pref === 'system' && media.matches) ? 'g100' : 'white';
      }

      function applyTheme(resolved) {
        const dark = resolved === 'g100';
        document.documentElement.dataset.theme = dark ? 'g100' : 'white';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (meta) meta.setAttribute('content', dark ? '#161616' : '#ffffff');
      }

      function buildFrameUrl(pref) {
        const url = new URL(APP_URL);
        url.searchParams.set('embedded', 'true');
        url.searchParams.set('theme', VALID.has(pref) ? pref : 'system');
        url.searchParams.set('themeChannel', themeChannel);
        url.searchParams.set('historyChannel', historyChannel);
        url.searchParams.set('historyOrigin', window.location.origin);
        return url.href;
      }

      function loadFrame(pref) {
        const next = buildFrameUrl(pref);
        if (frame.src !== next) frame.src = next;
      }

      applyTheme(resolveTheme(preference));
      loadFrame(preference);

      media.addEventListener?.('change', () => {
        if (preference === 'system') applyTheme(resolveTheme(preference));
      });

      window.addEventListener('storage', (event) => {
        if (event.key === KEY) {
          preference = readPreference();
          applyTheme(resolveTheme(preference));
          loadFrame(preference);
        }
      });

      window.addEventListener('message', (event) => {
        if (!isTrustedAppMessage(event, frame.contentWindow)) return;
        const message = event.data;
        if (message?.source === 'sanpokai-theme-child') {
          if (message.channel !== themeChannel) return;
          if (!VALID.has(message.preference)) return;
          preference = message.preference;
          try { localStorage.setItem(KEY, preference); } catch {}
          applyTheme(message.resolvedTheme === 'g100' ? 'g100' : 'white');
          return;
        }

        if (message?.source !== HISTORY_CHILD_SOURCE || message.channel !== historyChannel) return;
        if (message.type !== 'history-ready' && message.type !== 'history-update') return;
        if (message.type === 'history-ready') {
          historyReady = true;
          window.clearTimeout(fallbackTimer);
          status.hidden = true;
        }
        const stored = readHistory();
        const merged = message.type === 'history-ready'
          ? saveHistory(mergeFormHistories(stored, message.history))
          : saveHistory(mergeFormHistories(stored, message.history));
        sendHistory(event.source, merged, event.origin);
      });
    })();
  </script>
</body>
</html>
