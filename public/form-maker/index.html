<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>山歩会フォームメーカー</title>
  <style>
    :root {
      color-scheme: light;
      --host-bg: #ffffff;
      --host-text: #161616;
    }
    :root[data-theme='g100'] {
      color-scheme: dark;
      --host-bg: #161616;
      --host-text: #f4f4f4;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--host-bg);
      color: var(--host-text);
    }
    body {
      overflow: hidden;
      overscroll-behavior: none;
    }
    #form-maker-frame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: var(--host-bg);
      color-scheme: inherit;
    }
    .fallback {
      position: fixed;
      inset: auto 1rem max(1rem, env(safe-area-inset-bottom)) 1rem;
      z-index: -1;
      margin: 0;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: var(--host-text);
    }
    .fallback a { color: #0f62fe; }
  </style>
</head>
<body>
  <iframe
    id="form-maker-frame"
    title="山歩会フォームメーカー"
    allow="clipboard-write; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <p class="fallback">表示できない場合は <a href="https://script.google.com/macros/s/AKfycbw0R5VgBdSLS8aRDJDw7GUIEfHlXRZ6rPrOgjXmO2N7LvhuoGyS_opUCFTCSiUiDZw5/exec">フォームメーカーを直接開く</a></p>

  <script>
    (() => {
      const KEY = 'sanpokai-theme-preference-v1';
      const VALID = new Set(['system', 'light', 'dark']);
      const HISTORY_KEY = 'sanpokai-form-builder-history-v1';
      const HISTORY_LIMIT = 10;
      const HISTORY_CHILD_SOURCE = 'sanpokai-form-history-child';
      const HISTORY_HOST_SOURCE = 'sanpokai-form-history-host';
      const APP_URL = 'https://script.google.com/macros/s/AKfycbw0R5VgBdSLS8aRDJDw7GUIEfHlXRZ6rPrOgjXmO2N7LvhuoGyS_opUCFTCSiUiDZw5/exec';
      const frame = document.getElementById('form-maker-frame');
      const meta = document.querySelector('meta[name="theme-color"]');
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const themeChannel = createChannel('theme');
      const historyChannel = createChannel('history');
      let preference = readPreference();

      function createChannel(prefix) {
        if (window.crypto?.randomUUID) return window.crypto.randomUUID();
        const random = Math.random().toString(36).slice(2);
        return `${prefix}-${Date.now().toString(36)}-${random}`;
      }

      function readPreference() {
        try {
          const stored = localStorage.getItem(KEY);
          return VALID.has(stored) ? stored : 'system';
        } catch {
          return 'system';
        }
      }

      function normalizeHistory(items) {
        if (!Array.isArray(items)) return [];
        const seen = new Set();
        const next = [];
        for (const item of items) {
          const formId = String(item?.formId || '').trim();
          if (!formId || seen.has(formId)) continue;
          seen.add(formId);
          next.push({ ...item, formId });
          if (next.length >= HISTORY_LIMIT) break;
        }
        return next;
      }

      function readHistory() {
        try {
          return normalizeHistory(JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'));
        } catch {
          return [];
        }
      }

      function mergeHistory(primary, secondary) {
        return normalizeHistory([...(Array.isArray(primary) ? primary : []), ...(Array.isArray(secondary) ? secondary : [])]);
      }

      function saveHistory(history) {
        const normalized = normalizeHistory(history);
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(normalized)); } catch {}
        return normalized;
      }

      function sendHistory(target, history) {
        target?.postMessage?.({
          source: HISTORY_HOST_SOURCE,
          channel: historyChannel,
          type: 'history-state',
          history,
        }, '*');
      }

      function resolveTheme(pref) {
        return pref === 'dark' || (pref === 'system' && media.matches) ? 'g100' : 'white';
      }

      function applyTheme(resolved) {
        const dark = resolved === 'g100';
        document.documentElement.dataset.theme = dark ? 'g100' : 'white';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (meta) meta.setAttribute('content', dark ? '#161616' : '#ffffff');
      }

      function buildFrameUrl(pref) {
        const url = new URL(APP_URL);
        url.searchParams.set('embedded', 'true');
        url.searchParams.set('theme', VALID.has(pref) ? pref : 'system');
        url.searchParams.set('themeChannel', themeChannel);
        url.searchParams.set('historyChannel', historyChannel);
        return url.href;
      }

      function loadFrame(pref) {
        const next = buildFrameUrl(pref);
        if (frame.src !== next) frame.src = next;
      }

      applyTheme(resolveTheme(preference));
      loadFrame(preference);

      media.addEventListener?.('change', () => {
        if (preference === 'system') applyTheme(resolveTheme(preference));
      });

      window.addEventListener('storage', (event) => {
        if (event.key === KEY) {
          preference = readPreference();
          applyTheme(resolveTheme(preference));
          loadFrame(preference);
        }
      });

      window.addEventListener('message', (event) => {
        const message = event.data;
        if (message?.source === 'sanpokai-theme-child') {
          if (message.channel !== themeChannel) return;
          if (!VALID.has(message.preference)) return;
          preference = message.preference;
          try { localStorage.setItem(KEY, preference); } catch {}
          applyTheme(message.resolvedTheme === 'g100' ? 'g100' : 'white');
          return;
        }

        if (message?.source !== HISTORY_CHILD_SOURCE || message.channel !== historyChannel) return;
        if (message.type !== 'history-ready' && message.type !== 'history-update') return;
        const stored = readHistory();
        const merged = message.type === 'history-ready'
          ? saveHistory(mergeHistory(stored, message.history))
          : saveHistory(mergeHistory(message.history, stored));
        sendHistory(event.source, merged);
      });
    })();
  </script>
</body>
</html>
