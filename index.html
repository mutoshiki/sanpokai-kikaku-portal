<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="山歩会の学務提出書類作成、登山計画書作成、フォーム作成、サークル企画ツールへの入口です。">
  <meta name="theme-color" content="#161616">
  <meta name="color-scheme" content="light">
  <title>山歩会企画ツール一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --cds-background:#ffffff;
      --cds-layer:#f4f4f4;
      --cds-layer-hover:#e8e8e8;
      --cds-text-primary:#161616;
      --cds-text-secondary:#525252;
      --cds-border-subtle:#e0e0e0;
      --cds-border-strong:#8d8d8d;
      --cds-border-tile:#8d8d8d;
      --cds-link-primary:#0f62fe;
      --cds-link-primary-hover:#0043ce;
      --cds-icon-interactive:#0f62fe;
      --cds-focus:#0f62fe;
    }

    *{box-sizing:border-box}
    html{background:var(--cds-background)}
    body{
      min-width:320px;
      margin:0;
      background:var(--cds-background);
      color:var(--cds-text-primary);
      font-family:"IBM Plex Sans JP","IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
      font-size:14px;
      line-height:20px;
      letter-spacing:.16px;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}

    .skip-link{
      position:fixed;
      top:0;
      left:0;
      z-index:100;
      padding:8px 16px;
      background:#ffffff;
      color:var(--cds-link-primary);
      transform:translateY(-120%);
    }
    .skip-link:focus{transform:none}

    /* Carbon UI shell header */
    .app-header{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      align-items:stretch;
      width:100%;
      height:48px;
      background:#161616;
      color:#f4f4f4;
      border-bottom:1px solid #393939;
    }
    .app-name{
      display:flex;
      align-items:center;
      min-height:48px;
      padding:0 16px;
      color:#f4f4f4;
      text-decoration:none;
      font-size:14px;
      line-height:18px;
      font-weight:600;
      letter-spacing:.16px;
      white-space:nowrap;
    }
    .app-name:hover{background:#353535}
    .app-name:focus-visible{
      outline:2px solid #ffffff;
      outline-offset:-3px;
    }

    /* Carbon 2x Grid page scaffold */
    .page{
      width:100%;
      max-width:1584px;
      margin:0 auto;
      padding:32px 16px 80px;
    }
    .page-title{
      max-width:672px;
      margin:0 0 32px;
      font-size:28px;
      line-height:36px;
      font-weight:400;
      letter-spacing:0;
    }
    .section-title{
      margin:0;
      font-size:20px;
      line-height:28px;
      font-weight:400;
      letter-spacing:0;
    }

    /* Carbon clickable tiles, using the current contrast-border treatment. */
    .tool-grid{
      display:grid;
      grid-template-columns:1fr;
      grid-auto-rows:1fr;
      gap:8px;
      width:100%;
    }
    .tool-tile{
      position:relative;
      display:block;
      width:100%;
      min-width:128px;
      min-height:152px;
      padding:16px 48px 48px 16px;
      background:var(--cds-layer);
      border:1px solid var(--cds-border-tile);
      color:var(--cds-text-primary);
      text-decoration:none;
    }
    .tool-tile:hover{background:var(--cds-layer-hover)}
    .tool-tile:focus-visible{
      outline:2px solid var(--cds-focus);
      outline-offset:-2px;
    }
    .tool-title{
      margin:0 0 8px;
      font-size:16px;
      line-height:22px;
      font-weight:400;
      letter-spacing:0;
    }
    .tool-description{
      max-width:36rem;
      margin:0;
      color:var(--cds-text-secondary);
      font-size:14px;
      line-height:20px;
      letter-spacing:.16px;
    }
    .tool-arrow{
      position:absolute;
      right:12px;
      bottom:12px;
      width:20px;
      height:20px;
      fill:var(--cds-icon-interactive);
    }

    /* Carbon structured list */
    .projects{
      width:100%;
      margin-top:64px;
    }
    .projects-heading{
      padding-bottom:16px;
    }
    .structured-list{
      width:100%;
      border-top:1px solid var(--cds-border-strong);
    }
    .structured-head,
    .structured-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(160px,224px);
      column-gap:32px;
      align-items:start;
    }
    .structured-head{
      padding:16px 0 8px;
      border-bottom:1px solid var(--cds-border-subtle);
      color:var(--cds-text-primary);
      font-size:14px;
      line-height:18px;
      font-weight:600;
      letter-spacing:.16px;
    }
    .structured-row{
      min-height:60px;
      padding:16px 0 24px;
      border-bottom:1px solid var(--cds-border-subtle);
    }
    .project-main{min-width:0}
    .project-link{
      display:inline;
      color:var(--cds-link-primary);
      text-decoration:none;
      font-size:14px;
      line-height:20px;
      font-weight:600;
      letter-spacing:.16px;
      overflow-wrap:anywhere;
    }
    .project-link:hover{
      color:var(--cds-link-primary-hover);
      text-decoration:underline;
    }
    .project-link:focus-visible{
      outline:2px solid var(--cds-focus);
      outline-offset:2px;
    }
    .project-meta,
    .project-date{
      color:var(--cds-text-secondary);
      font-size:14px;
      line-height:20px;
      font-weight:400;
      letter-spacing:.16px;
    }
    .project-meta{
      display:block;
      margin-top:4px;
    }
    .empty-state{
      margin:0;
      padding:16px 0 24px;
      border-bottom:1px solid var(--cds-border-subtle);
      color:var(--cds-text-secondary);
      font-size:14px;
      line-height:20px;
    }

    @media (min-width:672px){
      .page{padding:40px 32px 96px}
      .tool-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:16px;
      }
      .tool-tile{min-height:176px}
    }

    @media (min-width:1056px){
      .tool-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
        gap:32px;
      }
      .tool-tile{min-height:192px}
      .projects{max-width:calc(50% - 16px)}
    }

    @media (max-width:671px){
      .projects{margin-top:48px}
      .projects-heading{padding-bottom:12px}
      .structured-head{display:none}
      .structured-row{
        grid-template-columns:1fr;
        row-gap:4px;
        padding:16px 0 24px;
      }
      .project-link{
        font-size:16px;
        line-height:22px;
        font-weight:400;
      }
      .project-meta,
      .project-date{
        font-size:12px;
        line-height:16px;
        letter-spacing:.32px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="app-header">
    <a class="app-name" href="./">山歩会企画ツール一覧</a>
  </header>

  <main id="main" class="page">
    <h1 class="page-title">ツール</h1>

    <section class="tool-grid" aria-label="利用するツール">
      <a
        class="tool-tile"
        href="https://github.com/mutoshiki/sampokai-submission-builder/releases"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="学務提出書類メーカーを新しいタブで開く"
      >
        <h2 class="tool-title">学務提出書類メーカー</h2>
        <p class="tool-description">企画者は応募フォームの回答から引き継ぎデータを作り、それを使ってサークル長が学務への提出書類を簡単に作れます。</p>
        <svg class="tool-arrow" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M18 6l-1.4 1.4 7.6 7.6H6v2h18.2l-7.6 7.6L18 26l10-10z"/>
        </svg>
      </a>

      <a
        class="tool-tile"
        href="https://mutoshiki.github.io/tozan-keikaku-syo-maker/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="登山計画書メーカーを新しいタブで開く"
      >
        <h2 class="tool-title">登山計画書メーカー</h2>
        <p class="tool-description">YAMAPのルートと行程のスクリーンショットを添付するだけで、日付などの最小限の入力で登山計画書を作成できます。</p>
        <svg class="tool-arrow" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M18 6l-1.4 1.4 7.6 7.6H6v2h18.2l-7.6 7.6L18 26l10-10z"/>
        </svg>
      </a>

      <a
        class="tool-tile"
        href="https://script.google.com/a/gmail.com/macros/s/AKfycbw0R5VgBdSLS8aRDJDw7GUIEfHlXRZ6rPrOgjXmO2N7LvhuoGyS_opUCFTCSiUiDZw5/exec"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="山歩会フォームメーカーを新しいタブで開く"
      >
        <h2 class="tool-title">山歩会フォームメーカー</h2>
        <p class="tool-description">日付や企画名などを入力するだけで、応募フォームの作成を簡単に行えます。</p>
        <svg class="tool-arrow" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M18 6l-1.4 1.4 7.6 7.6H6v2h18.2l-7.6 7.6L18 26l10-10z"/>
        </svg>
      </a>

      <a
        class="tool-tile"
        href="https://mutoshiki.github.io/circle-kikaku-tools/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="サークル企画ツールを新しいタブで開く"
      >
        <h2 class="tool-title">サークル企画ツール</h2>
        <p class="tool-description">タップして新しい企画を作成。車割や班割の作成、精算を効率よく行えます。</p>
        <svg class="tool-arrow" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M18 6l-1.4 1.4 7.6 7.6H6v2h18.2l-7.6 7.6L18 26l10-10z"/>
        </svg>
      </a>
    </section>

    <section class="projects" aria-labelledby="projects-title">
      <div class="projects-heading">
        <h2 class="section-title" id="projects-title">過去に開いた企画</h2>
      </div>

      <div class="structured-list" aria-live="polite">
        <div class="structured-head" aria-hidden="true">
          <span>企画</span>
          <span>最終更新</span>
        </div>
        <div id="project-rows"></div>
      </div>

      <noscript>
        <p class="empty-state">企画一覧の表示にはJavaScriptが必要です。</p>
      </noscript>
    </section>
  </main>

  <script>
    (()=>{
      'use strict';
      const TOOL_URL='https://mutoshiki.github.io/circle-kikaku-tools/';
      const STORE_PREFIX='sampokai_v10_split_';
      const SYNC_BASE_PREFIX=STORE_PREFIX+'sync_base_';
      const SYNC_OUTBOX_PREFIX=STORE_PREFIX+'sync_outbox_';
      const HISTORY_PREFIX='syawari_history_';
      const LAST_ROOM_KEY='syawari_last_room_id';
      const PROJECT_REGISTRY_KEY='sanpokai_portal_project_history_v1';
      const rows=document.getElementById('project-rows');
      if(!rows)return;

      function parse(value){
        try{
          const parsed=JSON.parse(value);
          return parsed&&typeof parsed==='object'?parsed:null;
        }catch{return null}
      }

      function readProjects(){
        const projects=new Map();
        function merge(roomId,data={}){
          const normalizedRoomId=String(roomId||'').trim();
          if(!normalizedRoomId)return;
          const current=projects.get(normalizedRoomId)||{roomId:normalizedRoomId,name:'',updatedAt:0};
          const updatedAt=Number(data.lastUpdatedAt??data.updatedAt??data.meta?.updatedAt??0)||0;
          const nextName=String(data.roomName??data.name??'').trim();
          projects.set(normalizedRoomId,{
            roomId:normalizedRoomId,
            name:nextName||current.name||'',
            updatedAt:Math.max(current.updatedAt||0,updatedAt)
          });
        }

        // Keep a portal-owned registry so the list survives cleanup/reset of the app's
        // per-room caches. The registry is additive: rooms are never removed implicitly.
        const registry=parse(localStorage.getItem(PROJECT_REGISTRY_KEY));
        if(Array.isArray(registry?.projects)){
          registry.projects.forEach(project=>merge(project?.roomId,project||{}));
        }

        for(let i=0;i<localStorage.length;i+=1){
          const key=localStorage.key(i);
          if(!key)continue;
          if(key.startsWith(SYNC_BASE_PREFIX)){
            merge(key.slice(SYNC_BASE_PREFIX.length),parse(localStorage.getItem(key))||{});
            continue;
          }
          if(key.startsWith(STORE_PREFIX)&&!key.startsWith(SYNC_OUTBOX_PREFIX)){
            merge(key.slice(STORE_PREFIX.length),parse(localStorage.getItem(key))||{});
            continue;
          }
          if(key.startsWith(HISTORY_PREFIX)){
            const roomId=key.slice(HISTORY_PREFIX.length);
            const history=parse(localStorage.getItem(key));
            if(Array.isArray(history)&&history.length){
              const latest=history.reduce((best,item)=>{
                return Number(item?.time||0)>Number(best?.time||0)?item:best;
              },history[0]);
              merge(roomId,{
                ...(latest?.data||{}),
                lastUpdatedAt:Number(latest?.data?.lastUpdatedAt??latest?.data?.updatedAt??latest?.time??0)||0
              });
            }else merge(roomId,{});
          }
        }

        const lastRoom=localStorage.getItem(LAST_ROOM_KEY)||'';
        if(lastRoom&&!projects.has(lastRoom))merge(lastRoom,{updatedAt:Date.now()});

        const sorted=[...projects.values()].sort((a,b)=>{
          if(a.roomId===lastRoom&&b.roomId!==lastRoom)return -1;
          if(b.roomId===lastRoom&&a.roomId!==lastRoom)return 1;
          return b.updatedAt-a.updatedAt;
        });

        try{
          localStorage.setItem(PROJECT_REGISTRY_KEY,JSON.stringify({
            version:1,
            projects:sorted,
            savedAt:Date.now()
          }));
        }catch(error){
          console.warn('企画一覧の永続履歴を保存できませんでした。',error);
        }

        return{lastRoom,projects:sorted};
      }

      function formatDate(value){
        if(!value)return '—';
        const date=new Date(value);
        if(Number.isNaN(date.getTime()))return '—';
        return new Intl.DateTimeFormat('ja-JP',{
          year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'
        }).format(date);
      }

      function render(){
        const{lastRoom,projects}=readProjects();
        rows.replaceChildren();
        if(!projects.length){
          const empty=document.createElement('p');
          empty.className='empty-state';
          empty.textContent='このブラウザで開いた企画はありません。';
          rows.append(empty);
          return;
        }

        projects.forEach(project=>{
          const row=document.createElement('div');
          row.className='structured-row';
          const main=document.createElement('div');
          main.className='project-main';
          const link=document.createElement('a');
          link.className='project-link';
          link.href=`${TOOL_URL}?room=${encodeURIComponent(project.roomId)}`;
          link.target='_blank';
          link.rel='noopener noreferrer';
          link.textContent=project.name||`企画 ${project.roomId}`;
          link.setAttribute('aria-label',`${link.textContent}を新しいタブで開く`);
          const meta=document.createElement('span');
          meta.className='project-meta';
          meta.textContent=project.roomId===lastRoom
            ?`最後に開いた企画 · ID: ${project.roomId}`
            :`ID: ${project.roomId}`;
          const date=document.createElement('time');
          date.className='project-date';
          date.textContent=formatDate(project.updatedAt);
          if(project.updatedAt)date.dateTime=new Date(project.updatedAt).toISOString();
          main.append(link,meta);
          row.append(main,date);
          rows.append(row);
        });
      }

      if(navigator.storage?.persist){
        navigator.storage.persist().catch(()=>false);
      }

      window.addEventListener('storage',render);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
      render();
    })();
  </script>
</body>
</html>
