<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="山歩会の学務提出書類作成、登山計画書作成、フォーム作成、サークル企画ツールへの入口です。" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const key = 'sanpokai-theme-preference-v1';
        let preference = 'system';
        try {
          const stored = localStorage.getItem(key);
          if (stored === 'system' || stored === 'light' || stored === 'dark') preference = stored;
        } catch (_) {}
        const systemDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const dark = preference === 'dark' || (preference === 'system' && systemDark);
        document.documentElement.dataset.carbonTheme = dark ? 'g100' : 'white';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? '#161616' : '#ffffff';
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f4f4f4; color: #161616; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      html[data-carbon-theme="g100"], html[data-carbon-theme="g100"] body { background: #161616; color: #f4f4f4; }
      .static-fallback { max-width: 960px; margin: 0 auto; padding: 72px 16px 40px; }
      .static-fallback h1 { font-size: 28px; font-weight: 400; margin: 0 0 24px; }
      .static-fallback__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: #c6c6c6; }
      .static-fallback a { display: block; min-height: 120px; padding: 20px; background: #ffffff; color: #161616; text-decoration: none; box-sizing: border-box; }
      html[data-carbon-theme="g100"] .static-fallback__grid { background: #525252; }
      html[data-carbon-theme="g100"] .static-fallback a { background: #262626; color: #f4f4f4; }
      .static-fallback a:hover { text-decoration: underline; }
      .static-fallback strong { display: block; font-size: 18px; font-weight: 500; margin-bottom: 8px; }
      .static-fallback span { font-size: 14px; line-height: 1.5; }
    </style>
    <title>山歩会企画ツール一覧</title>
  </head>
  <body>
    <div id="root">
      <main class="static-fallback" aria-label="山歩会企画ツール一覧">
        <h1>ツール</h1>
        <div class="static-fallback__grid">
          <a href="https://mutoshiki.github.io/tozan-keikaku-syo-maker/" target="_blank" rel="noopener noreferrer">
            <strong>登山計画書メーカー</strong>
            <span>日付などの基本情報とYAMAPのスクリーンショットから、登山計画書を作成できます。</span>
          </a>
          <a href="./form-maker/" target="_blank" rel="noopener noreferrer">
            <strong>応募フォームメーカー</strong>
            <span>企画名や日付などを入力して、応募フォームを作成できます。回答はサークル企画ツールに自動で取り込まれます。</span>
          </a>
          <a href="https://mutoshiki.github.io/circle-kikaku-tools/" target="_blank" rel="noopener noreferrer">
            <strong>サークル企画ツール</strong>
            <span>参加者の車割・班割、交通費の精算を1つの企画で管理できます。参加者発表用の文面も作成できます。</span>
          </a>
          <a href="https://github.com/mutoshiki/sampokai-submission-builder/releases" target="_blank" rel="noopener noreferrer">
            <strong>学務提出書類作成ツール</strong>
            <span>企画者から受け取った引き継ぎデータから、学務提出書類を作成できます。</span>
          </a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
