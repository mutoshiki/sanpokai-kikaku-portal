<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="山歩会の企画作成・企画管理・提出書類作成への入口です。">
  <title>山歩会企画ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="app-header">
    <a class="app-name" href="./" aria-label="山歩会企画ツール トップ">山歩会企画ツール</a>
    <nav class="header-nav" aria-label="メインナビゲーション">
      <a href="guide.html">提出書類</a>
    </nav>
  </header>

  <main id="main" class="page-shell">
    <section class="page-heading" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">企画一覧</h1>
        <p>このブラウザで開いた企画を表示します。</p>
      </div>
      <a class="button button-primary" href="https://script.google.com/macros/s/AKfycbwveM99euD8V5dxB6xLPYlpHuIc-KJlaaP8LHffh6ZMQBnAmO6XwX_ijQG-brUgqZmj/exec">
        新しい企画を作る
        <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M17 6h-2v9H6v2h9v9h2v-9h9v-2h-9z"/></svg>
      </a>
    </section>

    <section class="project-section" aria-labelledby="projects-title">
      <div class="section-bar">
        <h2 id="projects-title">過去に開いた企画</h2>
        <button class="text-button" id="refresh-projects" type="button">更新</button>
      </div>

      <div id="project-list" class="project-list" aria-live="polite"></div>

      <noscript>
        <div class="notification notification-error">企画一覧の表示にはJavaScriptが必要です。</div>
      </noscript>
    </section>

    <section class="utility-section" aria-labelledby="documents-title">
      <div>
        <h2 id="documents-title">提出書類</h2>
        <p>参加者名簿や登山計画書を作る手順を確認できます。</p>
      </div>
      <a class="button button-secondary" href="guide.html">
        使い方を見る
        <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M18 6l-1.4 1.4 7.6 7.6H6v2h18.2l-7.6 7.6L18 26l10-10z"/></svg>
      </a>
    </section>
  </main>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
