<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="山歩会の企画ツールを開きます。" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        if (window.location.hostname !== 'mutoshiki.github.io') return;
        const portalRoot = '/sanpokai-kikaku-portal';
        const path = window.location.pathname.replace(/\/+$/, '');
        if (path !== portalRoot && path !== `${portalRoot}/index.html`) return;

        const destination = new URL('https://mutoshiki.github.io/circle-kikaku-tools/');
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
    <script>
      (() => {
        const key = 'sanpokai-theme-preference-v1';
        let preference = 'system';
        try {
          const stored = localStorage.getItem(key);
          if (stored === 'system' || stored === 'light' || stored === 'dark') preference = stored;
        } catch (_) {}
        const systemDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const dark = preference === 'dark' || (preference === 'system' && systemDark);
        document.documentElement.dataset.carbonTheme = dark ? 'g100' : 'white';
        document.documentElement.classList.add(dark ? 'cds--g100' : 'cds--white', 'cds--layer-one');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? '#161616' : '#ffffff';
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: var(--cds-background); color: var(--cds-text-primary); font-family: var(--cds-body-01-font-family, "IBM Plex Sans JP", "IBM Plex Sans", sans-serif); }
      .static-fallback { max-width: 60rem; margin: 0 auto; padding: var(--cds-spacing-09) var(--cds-spacing-05); }
      .static-fallback h1 { font-size: var(--cds-heading-03-font-size); font-weight: var(--cds-heading-03-font-weight); line-height: var(--cds-heading-03-line-height); margin: 0 0 var(--cds-spacing-05); }
      .static-fallback a { color: var(--cds-link-primary); }
    </style>
    <title>山歩会企画ツール</title>
  </head>
  <body>
    <div id="root">
      <main class="static-fallback" aria-label="企画ツールへの移動">
        <h1>企画ツールへ移動しています</h1>
        <p>自動で移動しない場合は、<a href="https://mutoshiki.github.io/circle-kikaku-tools/">企画ツールを開いてください。</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
