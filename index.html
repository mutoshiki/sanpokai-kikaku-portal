<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="山歩会の企画に使うツールをまとめています。" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        const key = 'sanpokai-theme-preference-v1';
        let preference = 'system';
        try {
          const stored = localStorage.getItem(key);
          if (stored === 'system' || stored === 'light' || stored === 'dark') preference = stored;
        } catch (_) {}
        const systemDark = Boolean(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const dark = preference === 'dark' || (preference === 'system' && systemDark);
        document.documentElement.dataset.carbonTheme = dark ? 'g100' : 'white';
        document.documentElement.classList.add(dark ? 'cds--g100' : 'cds--white', 'cds--layer-one');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? '#161616' : '#ffffff';
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100%; background: var(--cds-background); color: var(--cds-text-primary); font-family: var(--cds-body-01-font-family, "IBM Plex Sans JP", "IBM Plex Sans", sans-serif); }
      .static-fallback { max-width: 60rem; margin: 0 auto; padding: var(--cds-spacing-09) var(--cds-spacing-05) var(--cds-spacing-09); }
      .static-fallback h1 { font-size: var(--cds-heading-03-font-size); font-weight: var(--cds-heading-03-font-weight); line-height: var(--cds-heading-03-line-height); margin: 0 0 var(--cds-spacing-06); }
      .static-fallback__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: var(--cds-spacing-01); background: var(--cds-border-subtle); }
      .static-fallback a { display: block; min-height: 7.5rem; padding: var(--cds-spacing-05); background: var(--cds-layer); color: var(--cds-text-primary); text-decoration: none; box-sizing: border-box; }
      .static-fallback a:hover { text-decoration: underline; }
      .static-fallback strong { display: block; font-size: var(--cds-heading-compact-01-font-size); font-weight: var(--cds-heading-compact-01-font-weight); line-height: var(--cds-heading-compact-01-line-height); margin-bottom: var(--cds-spacing-03); }
      .static-fallback span { font-size: var(--cds-body-01-font-size); line-height: var(--cds-body-01-line-height); }
    </style>
    <title>山歩会企画ツール一覧</title>
  </head>
  <body>
    <div id="root">
      <main class="static-fallback" aria-label="山歩会企画ツール一覧">
        <h1>山歩会企画ツール一覧</h1>
        <div class="static-fallback__grid">
          <a href="https://mutoshiki.github.io/tozan-keikaku-syo-maker/" target="_blank" rel="noopener noreferrer">
            <strong>登山計画書メーカー</strong>
            <span>YAMAPの画像から、登山計画書を作れます。</span>
          </a>
          <a href="./form-maker/" target="_blank" rel="noopener noreferrer">
            <strong>応募フォームメーカー</strong>
            <span>参加者募集用のGoogleフォームを作れます。</span>
          </a>
          <a href="https://mutoshiki.github.io/circle-kikaku-tools/" target="_blank" rel="noopener noreferrer">
            <strong>サークル企画ツール</strong>
            <span>車割り・班割りと交通費の精算に使います。</span>
          </a>
          <a href="https://github.com/mutoshiki/sampokai-submission-builder/releases" target="_blank" rel="noopener noreferrer">
            <strong>学務提出書類作成ツール</strong>
            <span>学務に出す書類を作れます。引き継ぎデータも使えます。</span>
          </a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
