name: Quality guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - name: Verify Pages deployment contract
        run: node tests/deployment-contract.cjs
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser QA
        env:
          CHROMIUM_POLICY_DIR: /tmp/empty-chromium-policy
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: portal-browser-evidence
          path: |
            browser-evidence/*.png
            browser-evidence/*.json
          if-no-files-found: ignore
